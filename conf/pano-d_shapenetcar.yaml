# PANO-D: H=2, M=1024, C=192.
exp: shapenetcar_fold0-PANO-D
seed: 0

data_name: shapenetcar_fold0
data_root: ./dataset
train_batch_size: 2
val_batch_size: 4
shapenetcar_subsampling: -1
shapenetcar_eval_subsampling: -1
shapenetcar_sampling_mode: all
shapenetcar_eval_sampling_mode: all
shapenetcar_pressure_weight: 1.0

model_name: PANO-D
mixed_precision: none
out_droprate: 0.0

loss_name: rL2
loss_weight: '1'
optimizer_name: AdamW
lr: 0.0008
weight_decay: 5.0e-05
scheduler_name: OneCycle
min_lr: 1.0e-05
warmup_epochs: 80

epoch: 400
grad_clip: 1000.0
n_train_vis: 4
log_print_interval_epoch: 1
model_save_interval_epoch: -1
