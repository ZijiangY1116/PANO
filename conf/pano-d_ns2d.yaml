# PANO-D: H=2, M=1024, C=192.
exp: ns2d-PANO-D
seed: 0

data_name: ns2d
data_root: ./dataset
train_batch_size: 2
val_batch_size: 4
rollout_history: 10
rollout_autoreg_ratio: 0.0

model_name: PANO-D
mixed_precision: fp16
out_droprate: 0.0

loss_name: rL2
loss_weight: '1'
optimizer_name: AdamW
lr: 0.001
weight_decay: 5.0e-05
scheduler_name: OneCycle
min_lr: 1.0e-05
warmup_epochs: 100

epoch: 500
grad_clip: 1000.0
n_train_vis: 4
log_print_interval_epoch: 1
model_save_interval_epoch: -1
